# ============================================================================
# LIST LOCATIONS BY BUSINESS
# ============================================================================

query ListLocationsByBusiness($businessId: UUID!) @auth(level: USER_ANON, insecureReason: "Trial users (anonymous) need access to this functionality during their 4-week trial period. Business-scoped access is enforced via businessId validation.") {
  locations(where: { businessId: { eq: $businessId } }) {
    id
    businessId
    name
    code
    type
    phone
    email
    isActive
    createdAt
  }
}
