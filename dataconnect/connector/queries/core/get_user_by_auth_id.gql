# ============================================================================
# GET USER BY AUTH ID
# ============================================================================

query GetUserByAuthId($id: String!) @auth(level: PUBLIC, insecureReason: "Required to check user existence during session restoration. User ID is from Firebase Auth UID which is already validated by Firebase Auth.") {
  user(id: $id) {
    id
    businessId
    role
    firstName
    lastName
    email
    mobile
    isActive
  }
}
