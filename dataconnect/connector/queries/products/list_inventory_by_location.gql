# ============================================================================
# LIST INVENTORY BY LOCATION
# ============================================================================

query ListInventoryByLocation($locationId: UUID!) @auth(level: USER_ANON, insecureReason: "Trial users (anonymous) need access to this functionality during their 4-week trial period. Business-scoped access is enforced via businessId validation.") {
  inventoryLevels(where: { locationId: { eq: $locationId } }) {
    id
    productId
    locationId
    batchId
    businessId
    quantityOnHand
    quantityReserved
    quantityAvailable
    quantityInTransit
    averageCost
    totalValue
    lastCountDate
    lastDispenseDate
    lastRestockDate
    updatedAt
  }
}
