# ============================================================================
# LIST PRICING BY LOCATION
# ============================================================================

query ListPricingByLocation($businessId: UUID!) @auth(level: USER_ANON, insecureReason: "Trial users (anonymous) need access to this functionality during their 4-week trial period. Business-scoped access is enforced via businessId validation.") {
  productPricings(where: { businessId: { eq: $businessId } }) {
    id
    productId
    businessId
    wholesaleCost
    retailPrice
    walkInPrice
    bronzePrice
    silverPrice
    goldPrice
    diamondPrice
    platinumPrice
    grossMarginPercent
    markupPercent
    taxRate
    effectiveDate
    updatedAt
  }
}
