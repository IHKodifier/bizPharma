# ============================================================================
# GET BUSINESS BY ID
# ============================================================================

query GetBusinessById($id: UUID!) @auth(level: USER_ANON, insecureReason: "Required for session restoration after onboarding. Business ID comes from authenticated user's businessId field which is already validated.") {
  business(id: $id) {
    id
    name
    tier
    subscriptionStartDate
    subscriptionEndDate
    isActive
    maxUsers
    maxLocations
    logo
    banner
    phone
    createdAt
    updatedAt
  }
}
