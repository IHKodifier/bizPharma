# ============================================================================
# LIST ALL CUSTOMERS
# ============================================================================

query ListAllCustomers @auth(level: USER_ANON, insecureReason: "Trial users (anonymous) need access to this functionality during their 4-week trial period. Business-scoped access is enforced via businessId validation.") {
  customers {
    id
    businessId
    firstName
    lastName
    email
    phone
    dateOfBirth
    tier
    isActive
    createdAt
  }
}
