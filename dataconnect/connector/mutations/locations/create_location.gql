# ============================================================================
# CREATE LOCATION
# ============================================================================

mutation CreateLocation(
  $businessId: UUID!
  $name: String!
  $code: String!
  $type: LocationType!
  $phone: String
  $email: String
  $operatingHours: String
  $licenseNumber: String
) @auth(level: USER_ANON, insecureReason: "Trial users (anonymous) need access to this functionality during their 4-week trial period. Business-scoped access is enforced via businessId validation.") @transaction {
  location_insert(data: {
    businessId: $businessId
    name: $name
    code: $code
    type: $type
    phone: $phone
    email: $email
    operatingHours: $operatingHours
    licenseNumber: $licenseNumber
    isActive: true
  })
}

